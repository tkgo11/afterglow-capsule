[workspace]
resolver = "3"
members = ["apps/builder", "apps/viewer", "crates/*"]
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
chrono-tz = "=0.10.4"
semver = { version = "=1.0.28", features = ["serde"] }
thiserror = "=2.0.21"
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
