doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_table"
path = "fuzz_targets/object_table.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workspace"
path = "fuzz_targets/workspace.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "prepared_encrypted_object"
path = "fuzz_targets/prepared_encrypted_object.rs"
