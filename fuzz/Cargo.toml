[package]
name = "afterglow-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
ag-schema = { path = "../crates/ag-schema" }
ag-project = { path = "../crates/ag-project" }
ag-capsule = { path = "../crates/ag-capsule" }
ag-prepared-object-store = { path = "../preparation/object-store" }
semver = "=1.0.28"

[[bin]]
name = "capsule_header"
